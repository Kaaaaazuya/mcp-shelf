name: CI

on:
  pull_request:
  push:
    branches: [main]
  # release-deploy.yml がデプロイ前に同じ確認を走らせる
  workflow_call:

# ワークフローに渡すトークンは読み取りだけにする
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # アクションはタグではなくコミット SHA で固定する（タグは付け替えられるため）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # .npmrc の ignore-scripts により依存のインストールスクリプトは走らない
      - run: npm ci
      - run: npm run check:deps
      # レジストリ署名と provenance を検証する
      - run: npm audit signatures
      - run: npm audit --audit-level=high
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # ブラウザ本体は Playwright の版ごとにキャッシュする（OS のライブラリは毎回入れる）
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # 起動する Worker が必須の環境変数を求めるので、ダミーの値を渡す（本物の IP は扱わないので秘密である必要はない）
      - run: npm run test:e2e
        env:
          IP_HASH_SECRET: ci-dummy
